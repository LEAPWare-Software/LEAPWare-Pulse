[project]
name = "leapware-pulse"
version = "0.2.0"
description = "Three branded checklist views of the full agreed plan: Panorama, Brief and Focus."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime dependency policy: NONE. Everything shipped is Python 3.10+
# standard library only (LWP-R7). pytest below is a dev-only dependency for
# running tests; it is never imported by a shipped plugin.

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
